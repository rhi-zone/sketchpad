[package]
name = "sketchpad-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for sketchpad (Stable Diffusion, LLMs)"
license.workspace = true

[[bin]]
name = "sketchpad"
path = "src/main.rs"

[[bin]]
name = "inspect-safetensors"
path = "src/bin/inspect-safetensors.rs"

[features]
default = ["wgpu", "cpu", "cubecl", "precision-all"]
# For NVIDIA GPUs, build with: cargo build --features cuda
# For AMD GPUs,   build with: cargo build --no-default-features --features rocm,cpu,precision-all

# Backend features - use burn's own feature flags
cpu = ["burn/cpu"]
ndarray = ["burn/ndarray"]
tch = ["burn/tch"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda"]
rocm = ["burn-rocm", "dep:cubecl", "cubecl/hip", "sketchpad/cubecl", "sketchpad-unet/cubecl", "sketchpad-llm/cubecl", "burn-cubecl"]

# CubeCL acceleration (flash attention for f16/bf16) - enabled by default
cubecl = ["sketchpad/cubecl", "sketchpad-unet/cubecl", "sketchpad-llm/cubecl", "burn-cubecl", "dep:cubecl"]

# Precision support - compile only what you need
precision-f32 = []      # Enable f32 precision (slowest, most stable)
precision-f16 = []      # Enable f16 precision (fast, may NaN without upcast)
precision-bf16 = []     # Enable bf16 precision (fast, stable on Ampere+)
precision-all = ["precision-f32", "precision-f16", "precision-bf16"]

# Convenience presets (use with --no-default-features)
preset-fast = ["precision-bf16", "cubecl"]   # bf16 + flash attention only
preset-quality = ["precision-f32"]            # f32 only, no JIT overhead

# LLM features
llm-serve = ["sketchpad-llm/serve", "tokio"]

[dependencies]
burn = { workspace = true }
sketchpad = { path = "../sketchpad" }
sketchpad-core = { path = "../sketchpad-core" }
sketchpad-llm = { path = "../sketchpad-llm" }
sketchpad-convert = { path = "../sketchpad-convert" }
sketchpad-clip = { path = "../sketchpad-clip" }
sketchpad-unet = { path = "../sketchpad-unet" }
sketchpad-vae = { path = "../sketchpad-vae" }
sketchpad-samplers = { path = "../sketchpad-samplers" }
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
anyhow = "1.0"
indicatif = "0.17"
memmap2 = "0.9"
safetensors = "0.5"
half = "2"

# CubeCL dependencies (optional, for flash attention)
burn-cubecl = { workspace = true, optional = true }
cubecl = { version = "0.9.0-pre.6", optional = true, features = ["cuda", "wgpu"] }
burn-rocm = { version = "0.20.0-pre.6", optional = true }

# Serve dependencies (optional)
tokio = { version = "1", features = ["full"], optional = true }
