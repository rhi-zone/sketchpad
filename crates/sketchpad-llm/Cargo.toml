[package]
name = "sketchpad-llm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "LLM implementations for burn-models"
license.workspace = true

[features]
default = []
serve = ["axum", "tokio", "futures-util"]
cubecl = ["dep:sketchpad-cubecl"]

[dependencies]
sketchpad-core = { path = "../sketchpad-core" }
sketchpad-convert = { path = "../sketchpad-convert" }
sketchpad-cubecl = { workspace = true, optional = true }
burn = { workspace = true }
memmap2 = "0.9"
thiserror = { workspace = true }
tokenizers = "0.21"
ahash = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional serve dependencies
axum = { version = "0.7", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
futures-util = { version = "0.3", optional = true }
minijinja = "2.19.0"

[dev-dependencies]
burn-ndarray = { workspace = true }
