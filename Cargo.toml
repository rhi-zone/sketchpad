[workspace]
resolver = "2"
members = [
    "crates/sketchpad",
    "crates/sketchpad-core",
    "crates/sketchpad-clip",
    "crates/sketchpad-vae",
    "crates/sketchpad-unet",
    "crates/sketchpad-samplers",
    "crates/sketchpad-convert",
    "crates/sketchpad-cli",
    "crates/sketchpad-llm",
    "crates/sketchpad-dit",
    "crates/sketchpad-cubecl",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
sketchpad-core = { path = "crates/sketchpad-core" }
sketchpad-clip = { path = "crates/sketchpad-clip" }
sketchpad-vae = { path = "crates/sketchpad-vae" }
sketchpad-unet = { path = "crates/sketchpad-unet" }
sketchpad-samplers = { path = "crates/sketchpad-samplers" }
sketchpad-convert = { path = "crates/sketchpad-convert" }
sketchpad-llm = { path = "crates/sketchpad-llm" }
sketchpad-dit = { path = "crates/sketchpad-dit" }
sketchpad-cubecl = { path = "crates/sketchpad-cubecl" }

# External dependencies
burn = "0.20.0-pre.6"
burn-cubecl = "0.20.0-pre.6"
burn-ndarray = "0.20.0-pre.6"  # For tests only
bytemuck = "1.24"
half = "2.7"
memmap2 = "0.9"
regex = "1.12"
safetensors = "0.7"
thiserror = "2.0"

[profile.dev]
debug = 0
